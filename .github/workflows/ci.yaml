name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: pytest -v

      - name: Build Docker image
        run: |
          docker build -t used-car-predictor:test .

      - name: Run Docker container
        run: |
          docker run -d \
            --name used-car-test \
            -p 8501:8501 \
            used-car-predictor:test

      - name: Wait for Streamlit
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "Streamlit application is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Streamlit health check failed"
          docker logs used-car-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs used-car-test

      - name: Cleanup
        if: always()
        run: docker rm -f used-car-test
